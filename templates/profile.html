<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile</title>
    <style>
        :root {
            --bg: #f6fbff;
            --card: #ffffff;
            --accent: #2563eb;
            --muted: #6b7280;
            --text-primary: #1f2937;
            --radius: 12px;
            --shadow: 0 10px 30px rgba(15, 23, 42, 0.06);
        }
        body {
            font-family: Inter, system-ui, Segoe UI, Roboto, Arial;
            background-color: var(--bg);
            margin: 0;
            color: var(--text-primary);
        }
        .navbar {
            background-color: var(--card);
            padding: 1rem 2rem;
            box-shadow: var(--shadow);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .navbar .logo {
            font-weight: 700;
            font-size: 1.25rem;
            color: var(--accent);
        }
        .navbar .user-menu a {
            color: var(--muted);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            margin-left: 1.5rem;
        }
        .navbar .user-menu a:hover {
            color: var(--accent);
        }
        .container {
            max-width: 700px;
            margin: 2rem auto;
            padding: 0 2rem;
        }
        .profile-card {
            background-color: var(--card);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 2rem;
        }
        .profile-header {
            text-align: center;
            margin-bottom: 2rem;
            padding-bottom: 2rem;
            border-bottom: 1px solid #e5e7eb;
        }
        .profile-header h1 {
            font-size: 2rem;
            margin: 0;
        }
        .profile-header .role-badge {
            display: inline-block;
            margin-top: 0.5rem;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 600;
            background-color: #eef2ff;
            color: var(--accent);
        }
        .details-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 1.5rem;
        }
        .detail-item {
            display: flex;
            flex-direction: column;
        }
        .detail-item .label {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--muted);
            margin-bottom: 0.25rem;
        }
        .detail-item .value {
            font-size: 1.1rem;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="logo" style="display: flex; align-items: center; gap: 8px;">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg"><path d="M21.63 9.25L12.88 2.3C12.34 1.88 11.66 1.88 11.12 2.3L2.37 9.25C1.89 9.62 1.59 10.21 1.59 10.84V20C1.59 21.1 2.49 22 3.59 22H10.5C10.21 21.39 10 20.72 10 20C10 17.24 12.24 15 15 15C17.76 15 20 17.24 20 20C20 20.72 19.79 21.39 19.5 22H20.41C21.51 22 22.41 21.1 22.41 20V10.84C22.41 10.21 22.11 9.62 21.63 9.25ZM15 17C13.9 17 13 17.9 13 19C13 19.74 13.35 20.39 13.87 20.78C14.13 21.54 14.81 22.08 15.62 21.98C16.63 21.86 17.33 20.91 17.17 19.91C17.05 19.15 16.5 18.5 15.75 18.13C15.5 17.5 15 17 15 17Z"/></svg>
            <span>Roomify</span>
        </div>
        <div class="user-menu">
            <a href="{% url 'dashboard' %}">Dashboard</a>
            <a href="{% url 'logout' %}">Logout</a>
        </div>
    </nav>

    <div class="container">
        <div class="profile-card">
            <div class="profile-header">
                <h1>{{ user.name }}</h1>
                <span class="role-badge">{{ user.get_role_display }}</span>
            </div>
            <div class="details-grid">
                <div class="detail-item">
                    <span class="label">Email Address</span>
                    <span class="value">{{ user.email }}</span>
                </div>

                {% if user.role == 'student' %}
                <div class="detail-item">
                    <span class="label">Age</span>
                    <span class="value">{{ user.age }} years old</span>
                </div>
                <div class="detail-item">
                    <span class="label">Gender</span>
                    <span class="value">{{ user.get_gender_display|capfirst }}</span>
                </div>
                <div class="detail-item">
                    <span class="label">Date of Birth</span>
                    <span class="value">{{ user.dob|date:"F j, Y" }}</span>
                </div>
                {% endif %}
            </div>
        </div>
    </div>
</body>
</html>
